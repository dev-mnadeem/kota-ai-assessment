[project]
name = "ashe-pensions-assistant"
version = "0.1.0"
description = "LangGraph answer/critic agent over read-only SQL tools on ONS ASHE workplace pension tables"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["ui"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Long natural-language prompts and eval cases read better unwrapped.
"src/agent/prompts.py" = ["E501"]
"evals/*.py" = ["E501"]
